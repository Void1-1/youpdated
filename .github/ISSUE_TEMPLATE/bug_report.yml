name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before filing, it's worth checking
        [Troubleshooting](https://github.com/Void1-1/youpdated/blob/main/docs/troubleshooting.md)

        **Please don't paste API keys or tokens.** If you set `GITHUB_TOKEN` or
        `YOUTUBE_API_KEY`, say *that* you set it rather than what it is.

  - type: dropdown
    id: where
    attributes:
      label: Where it happened
      options:
        - Mac app (beta)
        - Windows app (beta)
        - Command line
        - All
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: |
        In the app, the steps you took. On the command line, the exact command you ran,
        and the smallest config that shows it.
      placeholder: |
        1. Config (trim it to just the entry that misbehaves):
           sources:
             steam:
               - 440
        2. Ran: youpdated check --all -v
        3. Saw: ...
      render: text
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Which source
      description: Leave blank if it isn't source-specific.
      multiple: true
      options:
        - git
        - npm
        - pypi
        - homebrew
        - steam
        - itch
        - youtube
        - browser
        - feed
        - webpage
        - not source-specific / core
        - a third-party source plugin

  - type: input
    id: version
    attributes:
      label: Youpdated version
      description: |
        In the app, App version and Engine version, from the bottom of Settings.
        On the command line, the output of `youpdated --version`.
      placeholder: App 0.9.0, Engine 0.5.0 / youpdated 0.5.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS, and Python version on the command line
      description: Your OS, plus the output of `python3 --version` if you use the command line.
      placeholder: macOS 15.1 / macOS 15.1, Python 3.12.4
    validations:
      required: true

  - type: textarea
    id: verbose-output
    attributes:
      label: Details or verbose output
      description: |
        In the app, the text from Copy Details in the Problems list, if there is one. Or the relevant log files (enable in advanced settings).
        On the command line, run the failing command with `-v` and paste the output. This
        shows each request and its status, which is usually enough to identify the cause.
        `--test` is a good alternative if the problem is in config handling.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the Troubleshooting page
          required: true
        - label: I removed any tokens, keys, or personal paths from what I pasted
          required: true
