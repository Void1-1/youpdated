version: 2
updates:
  # The workflow pins actions by major tag; this catches the ones that move.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    # Dependencies are declared with lower bounds, not pins, so only a genuinely
    # breaking upstream release needs attention here.
    open-pull-requests-limit: 5
