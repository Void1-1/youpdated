version: 2
updates:
  # Workflows pin actions by major tag, except the release's publish job, which pins
  # commits. This catches the tags that move and proposes new commits for the pins.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    # Dependencies are declared with lower bounds, not pins, so only a genuinely
    # breaking upstream release needs attention here.
    open-pull-requests-limit: 5
