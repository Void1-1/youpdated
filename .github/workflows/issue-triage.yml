name: issue triage

# Keeps GitHub's native issue status in step with milestones and pull requests,
# and labels new issues and PRs. Issue types (Bug, Feature, Task) come from the
# issue forms, not from here. Statuses are picked by category (backlog, planned,
# started, ...), so renaming one in the repository settings doesn't break this.
#
#   Issue opened or added to a milestone -> Todo, if it was in Backlog
#   Issue removed from its milestone     -> Backlog, if it was Todo
#   Draft PR that says "Fixes #N"        -> #N In progress
#   PR ready for review                  -> #N In review
#   That PR closed without merging       -> #N back to Todo (milestoned) or Backlog
#   Issue closed                         -> Done / Not planned, if GitHub left it open-looking
#   Issue reopened                       -> Todo (milestoned) or Backlog
#
# A merged PR closes the issue itself, and GitHub moves it to Done.
#
# Labels (only ever added, never removed):
#
#   PR changes files                     -> by path, from .github/labeler.yml
#   Issue or PR opened mentioning a      -> privacy / accessibility /
#     proxy, Tor, telemetry, VoiceOver,     youpdated-scanning
#     youpdated-scanning, a scanner...
#   Bug filed against an app             -> app
#   PR closes an issue                   -> the issue's descriptive labels
#
# pull_request_target runs this file from main, with a token that can write to
# issues even for PRs from forks. Nothing here checks out or runs PR code.

on:
  issues:
    types: [opened, milestoned, demilestoned, closed, reopened]
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

concurrency:
  group: triage-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;

            // Issue statuses are a public preview, rolling out gradually; the API
            // returns null planningStatuses where they aren't available.
            const r = await github.graphql(`
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  planningStatuses(first: 50) { nodes { id name category { key } } }
                }
              }`, { owner, repo });
            const statuses = r.repository.planningStatuses?.nodes ?? [];
            if (!statuses.length) {
              core.warning("Issue statuses aren't available on this repository; nothing to do.");
              return;
            }
            // The first status in a category (they come in display order), or the
            // one named `name` when the category has several, like "In progress"
            // and "In review" under started.
            const pick = (key, name) => {
              const all = statuses.filter(s => s.category.key === key);
              return all.find(s => s.name === name) ?? all[0] ?? null;
            };
            const status = {
              backlog: pick("backlog"),
              planned: pick("planned"),
              working: pick("started", "In progress"),
              review: pick("started", "In review"),
              completed: pick("completed"),
              not_planned: pick("not_planned"),
            };

            async function issue(number) {
              const r = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) {
                      id state stateReason milestone { number }
                      status { id name category { key } }
                    }
                  }
                }`, { owner, repo, number });
              const i = r.repository.issue;
              return {
                id: i.id, number, open: i.state === "OPEN", reason: i.stateReason,
                milestone: !!i.milestone, status: i.status,
                category: i.status ? i.status.category.key : null,
              };
            }

            // Setting a status also opens or closes the issue to match its category,
            // so callers only ever set an open status on an open issue and a closed
            // one on a closed issue.
            async function set(i, to) {
              if (!to || i.status?.id === to.id) return;
              await github.graphql(`
                mutation($issueId: ID!, $statusId: ID!) {
                  setIssueStatus(input: { issueId: $issueId, statusId: $statusId }) { clientMutationId }
                }`, { issueId: i.id, statusId: to.id });
              core.info(`#${i.number}: ${i.status?.name ?? "(none)"} -> ${to.name}`);
            }

            // Where an open issue sits when nobody is working on it.
            const resting = i => (i.milestone ? status.planned : status.backlog);
            const idle = i => !i.category || ["backlog", "planned"].includes(i.category);

            if (context.eventName === "issues") {
              const action = context.payload.action;
              // GitHub fires issues events for pull requests too (a PR is an issue
              // underneath), e.g. when one is milestoned. Only issues have a status,
              // and repository.issue(number:) returns null for a PR, so skip them.
              if (context.payload.issue.pull_request) return;
              const i = await issue(context.payload.issue.number);
              if ((action === "opened" || action === "milestoned") && i.open && idle(i)) await set(i, resting(i));
              if (action === "demilestoned" && i.open && i.category === "planned") await set(i, status.backlog);
              // GitHub normally moves a closed issue to a closed status itself. This
              // covers an issue that still shows an open one. Duplicates are left
              // alone: that status needs the duplicated issue, which only a person knows.
              if (action === "closed" && !i.open && (!i.category || ["backlog", "planned", "started"].includes(i.category))) {
                if (i.reason === "COMPLETED") await set(i, status.completed);
                if (i.reason === "NOT_PLANNED") await set(i, status.not_planned);
              }
              if (action === "reopened" && i.open && i.category !== "started") await set(i, resting(i));
              return;
            }

            // Pull request: find the issues it will close ("Fixes #N", or linked in the sidebar).
            const pr = context.payload.pull_request;
            const linked = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 20) { nodes { number repository { nameWithOwner } } }
                  }
                }
              }`, { owner, repo, number: pr.number });
            const numbers = linked.repository.pullRequest.closingIssuesReferences.nodes
              .filter(n => n.repository.nameWithOwner === `${owner}/${repo}`)
              .map(n => n.number);

            for (const n of numbers) {
              const i = await issue(n);
              if (!i.open) continue;
              if (pr.state === "open") await set(i, pr.draft ? status.working : status.review);
              else if (!pr.merged && i.category === "started") await set(i, resting(i));
              // Merged: the issue closes itself, and GitHub moves it to Done.
            }

  labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
        uses: actions/labeler@v7

      # Labels by wording and by linked issues. Only ever adds: a label someone
      # removed by hand stays removed unless the text that earned it is new.
      - if: >-
          (github.event_name == 'issues' && github.event.action == 'opened') ||
          (github.event_name == 'pull_request_target' &&
           contains(fromJSON('["opened", "reopened", "edited"]'), github.event.action))
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const action = context.payload.action;
            const pr = context.payload.pull_request;
            const item = pr ?? context.payload.issue;
            const add = new Set();

            // Wording. Only on the first look, so editing a typo doesn't bring back a
            // label someone took off. Template comments are dropped first, so the PR
            // template's own words never count. Keep these to terms that rarely mean
            // anything else here: "anonymous" and "tracking" are out, because of
            // anonymous registry tokens and "tracking a package". Bare "scanning" is
            // out too, because of CodeQL's code scanning.
            if (action === "opened") {
              const text = `${item.title}\n${item.body ?? ""}`.replace(/<!--[\s\S]*?-->/g, "");
              const keywords = {
                privacy: /\b(prox(y|ies)|tor|socks5?h?|telemetry|anonymity|fingerprint(ing)?|user[- ]agents?)\b/i,
                accessibility: /\b(accessibility|a11y|screen ?readers?|voiceover|narrator|nvda|jaws|high contrast|reduced? motion|dynamic type|keyboard navigation)\b/i,
                // youpdated-scanning, youpdated_scanning, youpdated[scanning], `youpdated scan`
                "youpdated-scanning": /\byoupdated(?:[-_ ]scanning|\[scanning\]| scan\b)|\bscanners?\b/i,
              };
              for (const [label, re] of Object.entries(keywords)) if (re.test(text)) add.add(label);
            }

            // The bug form's "Where it happened" answer lands in the body under its heading.
            if (!pr && /^(Mac|Windows) app \(beta\)\r?$/m.test(item.body ?? "")) add.add("app");

            // A PR inherits what describes the issues it closes ("Fixes #N", or linked
            // in the sidebar). Not triage labels like question or help wanted, which
            // are about the issue's discussion, not the change.
            if (pr) {
              const inherit = new Set(["app", "platform", "privacy", "accessibility", "source request", "documentation", "youpdated-scanning"]);
              const linked = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 20) {
                        nodes { repository { nameWithOwner } labels(first: 50) { nodes { name } } }
                      }
                    }
                  }
                }`, { owner, repo, number: pr.number });
              for (const n of linked.repository.pullRequest.closingIssuesReferences.nodes) {
                if (n.repository.nameWithOwner !== `${owner}/${repo}`) continue;
                for (const l of n.labels.nodes) if (inherit.has(l.name)) add.add(l.name);
              }
            }

            const have = new Set(item.labels.map(l => l.name));
            const labels = [...add].filter(l => !have.has(l));
            if (!labels.length) return;
            await github.rest.issues.addLabels({ owner, repo, issue_number: item.number, labels });
            core.info(`#${item.number}: + ${labels.join(", ")}`);
