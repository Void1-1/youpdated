name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets the release workflow run this exact suite before publishing, rather
  # than keeping a second, drifting copy of it.
  workflow_call:
  # Weekly, so CodeQL's new queries get run against code that hasn't changed.
  schedule:
    - cron: "17 4 * * 1"

# Nothing here needs to write to the repo, so the token gets read-only access.
# Without this, GITHUB_TOKEN inherits the repository default, which may be
# read-write (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test the installed command
        run: |
          youpdated --version
          youpdated sources
          youpdated init
          youpdated check --test -v
          youpdated uninstall --yes

  build:
    name: build + verify artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[publish]"
          python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Install from the wheel and run it
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/youpdated sources

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # CodeQL only runs once everything above has passed: there is no point
  # scanning code that doesn't work yet. This replaces GitHub's CodeQL
  # "default setup", which can't be made to wait on other jobs, and must stay
  # off in the repo settings or uploads from here are rejected.
  codeql:
    name: codeql · ${{ matrix.language }}
    needs: [test, build]
    # The release workflow calls this file to run the test matrix. It doesn't
    # need a scan: the commit was already scanned when it landed on main. A
    # called workflow sees its caller's name here, so this skips on release.
    if: github.workflow == 'tests'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
