name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here needs to write to the repo, so the token gets read-only access.
# Without this, GITHUB_TOKEN inherits the repository default, which may be
# read-write (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test the installed command
        run: |
          youpdated --version
          youpdated sources
          youpdated init
          youpdated check --test -v
          youpdated uninstall --yes

  build:
    name: build + verify artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[publish]"
          python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Install from the wheel and run it
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/youpdated sources

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
