name: tests

on:
  push:
    branches: [main]
  # labeled and unlabeled are here so that taking the skip-actions label off
  # starts the run it held back.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  # Lets the release workflow run this exact suite before publishing, rather
  # than keeping a second, drifting copy of it.
  workflow_call:
  # Weekly, so CodeQL's new queries get run against code that hasn't changed.
  schedule:
    - cron: "17 4 * * 1"

# Nothing here needs to write to the repo, so the token gets read-only access.
# Without this, GITHUB_TOKEN inherits the repository default, which may be
# read-write (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

# A new push or a label change starts another run on the PR, so the older one
# is cancelled rather than finishing for nothing. Only PR runs share a group:
# the name is fixed because a release calls this file, and github.workflow
# would then be the caller's name.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The skip-actions label marks a PR as still in progress. While it's on, the
  # other jobs here are skipped and this one fails, so the PR can't merge until
  # the label comes off and the suite passes. It has to be a required check of
  # its own: GitHub counts a skipped job as passing, and keeps counting results
  # from an earlier run on the same commit.
  skip-actions:
    name: skip-actions label
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: The skip-actions label must be off to merge
        if: contains(github.event.pull_request.labels.*.name, 'skip-actions')
        run: |
          echo "::error::This PR has the skip-actions label, so CI did not run. Remove the label to run CI and allow merging."
          exit 1

  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-actions') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test the installed command
        run: |
          youpdated --version
          youpdated sources
          youpdated init
          # `init` watches nothing, and `check` refuses an empty config
          youpdated add git Void1-1/youpdated
          youpdated check --test -v
          youpdated uninstall --yes

      # On Windows the package is removed in the background, once uninstall exits
      - name: Uninstall must remove the package
        shell: bash
        run: |
          for _ in $(seq 30); do
            python -m pip show youpdated > /dev/null 2>&1 || exit 0
            sleep 1
          done
          echo "::error::youpdated is still installed after uninstall"
          exit 1

  build:
    name: build + verify artifacts
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-actions') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[publish]"
          python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Install from the wheel and run it
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/youpdated sources

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # CodeQL only runs once everything above has passed: there is no point
  # scanning code that doesn't work yet. This replaces GitHub's CodeQL
  # "default setup", which can't be made to wait on other jobs, and must stay
  # off in the repo settings or uploads from here are rejected.
  codeql:
    name: codeql · ${{ matrix.language }}
    needs: [test, build]
    # The release workflow calls this file to run the test matrix. It doesn't
    # need a scan: the commit was already scanned when it landed on main. A
    # called workflow sees its caller's name here, so this skips on release.
    if: github.workflow == 'tests'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
