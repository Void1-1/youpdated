name: macOS app

# Runs when something the Mac app builds or tests against changes: its own
# source, the contract fixtures and shared cases both apps read, and the engine
on:
  push:
    branches: [main]
    paths:
      - "apps/macos/**"
      - "apps/contract/**"
      - "apps/shared/**"
      - "youpdated/**"
      - "pyproject.toml"
      - ".github/workflows/macos-app.yml"
  # labeled and unlabeled: taking skip-actions off starts the held-back run
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "apps/macos/**"
      - "apps/contract/**"
      - "apps/shared/**"
      - "youpdated/**"
      - "pyproject.toml"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS app
    # The skip-actions label holds CI back on an in-progress PR (see tests.yml)
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-actions') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build --package-path apps/macos

      - name: Test
        run: swift test --package-path apps/macos

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # In a temporary setup, and sends no real requests
      - name: Test against the real engine
        run: |
          python -m pip install .
          YOUPDATED_LIVE_ENGINE="$(which python) -m youpdated" swift test --package-path apps/macos --filter LiveEngineTests

      # The app bundle only builds through the project
      - name: Build the app
        run: >
          xcodebuild -project apps/macos/Youpdated.xcodeproj -scheme Youpdated
          -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
