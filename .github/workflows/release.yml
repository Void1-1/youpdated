name: release

# Publishing is deliberately tied to a GitHub Release rather than a bare tag:
# cutting the release is the explicit "yes, ship it", and it can be drafted and
# reviewed first. Nothing reaches PyPI until the full test matrix passes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only — do not upload to PyPI"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The same 13-job matrix used on every push. A release that can't pass CI
  # never gets as far as building.
  verify:
    uses: ./.github/workflows/tests.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[publish]"
          python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Version must match the release tag
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, sys, tomllib, pathlib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["TAG"].removeprefix("v")
          if version != tag:
              sys.exit(f"::error::tag {tag!r} does not match pyproject version {version!r}")
          print(f"tag and pyproject agree on {version}")
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Install the built wheel and run it
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/youpdated --version
          /tmp/verify/bin/youpdated sources

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Skipped on a dry-run dispatch; only a published release uploads.
    if: github.event_name == 'release' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/youpdated/
    permissions:
      # Required for PyPI trusted publishing. No API token is stored anywhere:
      # GitHub mints a short-lived OIDC token that PyPI verifies against the
      # publisher configured for this repo and workflow.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Uploads PEP 740 attestations alongside the artifacts: a Sigstore-signed
      # statement binding each file's digest to this repository and workflow.
      # Verify one with:
      #   curl https://pypi.org/integrity/youpdated/<version>/<filename>/provenance
      - uses: pypa/gh-action-pypi-publish@release/v1

  # There was an `attach` job here that copied the built artifacts onto the GitHub
  # Release, "so the two can be compared later". It is gone, because it cannot work:
  # this repo has immutable releases enabled, which freezes a release's assets the
  # moment it is published, and this workflow only runs *after* that. It failed on
  # v0.2.0 with `HTTP 422: Cannot upload assets to an immutable release`.
  #
  # Nothing of value was lost. Comparing a copy by eye was always the weak version of
  # the guarantee; the attestation above is the strong one, and PyPI serves it. The
  # release's own source archive is covered by immutability. Do not reinstate this by
  # turning immutable releases off — that trades a real integrity property for a
  # convenience one.
