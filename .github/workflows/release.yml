name: release

# Publishing is deliberately tied to a GitHub Release rather than a bare tag:
# cutting the release is the explicit "yes, ship it", and it can be drafted and
# reviewed first. Nothing reaches PyPI until the full test matrix passes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only — do not upload to PyPI"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The same 13-job matrix used on every push. A release that can't pass CI
  # never gets as far as building.
  verify:
    uses: ./.github/workflows/tests.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[publish]"
          python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Version must match the release tag
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, sys, tomllib, pathlib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["TAG"].removeprefix("v")
          if version != tag:
              sys.exit(f"::error::tag {tag!r} does not match pyproject version {version!r}")
          print(f"tag and pyproject agree on {version}")
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Install the built wheel and run it
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/youpdated --version
          /tmp/verify/bin/youpdated sources

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Skipped on a dry-run dispatch; only a published release uploads.
    if: github.event_name == 'release' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/youpdated/
    permissions:
      # Required for PyPI trusted publishing. No API token is stored anywhere:
      # GitHub mints a short-lived OIDC token that PyPI verifies against the
      # publisher configured for this repo and workflow.
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  attach:
    # Puts the exact artifacts that were published onto the GitHub Release too,
    # so the two can be compared later.
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"
