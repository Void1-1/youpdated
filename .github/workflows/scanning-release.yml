name: scanning-release

# youpdated-scanning (scanning/) is published to PyPI from a GitHub Release tagged
# `scanning-v<version>`, the same way release.yml publishes youpdated from `v<version>`.
# release.yml skips these tags, and this skips every other one.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only. Do not upload to PyPI"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The full matrix, which also runs scanning/tests on each OS
  verify:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'scanning-v')
    uses: ./.github/workflows/tests.yml
    # See release.yml: a called workflow can't ask for more than its caller grants
    permissions:
      contents: read
      security-events: write

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build scanning --outdir dist

      - name: Check metadata
        run: twine check dist/*

      # pyproject.toml and __version__ aren't cross-checked anywhere else
      - name: Version must match the release tag
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, re, sys, tomllib, pathlib
          version = tomllib.loads(pathlib.Path("scanning/pyproject.toml").read_text())["project"]["version"]
          init = pathlib.Path("scanning/youpdated_scanning/__init__.py").read_text()
          declared = re.search(r'^__version__ = "([^"]+)"', init, re.MULTILINE).group(1)
          tag = os.environ["TAG"].removeprefix("scanning-v")
          if not version == declared == tag:
              sys.exit(f"::error::tag {tag!r}, pyproject {version!r}, and __version__ {declared!r} must agree")
          print(f"tag, pyproject, and __version__ agree on {version}")
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      # From PyPI: this fails until the youpdated release it requires is published there
      - name: Install the built wheel with youpdated from PyPI and run it
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/python -c "import youpdated_scanning; print(youpdated_scanning.__version__)"
          /tmp/verify/bin/youpdated init
          /tmp/verify/bin/youpdated scan --test

      - uses: actions/upload-artifact@v7
        with:
          name: scanning-dist
          path: dist/

  publish:
    needs: build
    # Skipped on a dry-run dispatch; only a published release uploads.
    if: github.event_name == 'release' || inputs.dry_run == false
    runs-on: ubuntu-latest
    # The same environment as youpdated's, so the same reviewers approve it. Its deployment
    # rules have to allow `scanning-v*` tags, and PyPI's trusted publisher for
    # youpdated-scanning names this workflow file and this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/youpdated-scanning/
    permissions:
      # Trusted publishing, as in release.yml: no API token is stored anywhere
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanning-dist
          path: dist/

      # With PEP 740 attestations, as in release.yml
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
